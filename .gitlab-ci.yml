stages:
  - test
  - publish

image: node:20

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  script:
    - npm run build
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

publish:
  stage: publish
  script:
    - npm run build
    - echo "@frontendlinx:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_API_V4_URL#*//}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish -w @frontendlinx/tokens
    - npm publish -w @frontendlinx/ui
  rules:
    - if: '$CI_COMMIT_TAG'
